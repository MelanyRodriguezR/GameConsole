# GameConsole completo en una sola orden:
#
#   docker compose up --build
#
# Levanta:
#   consola    (Node.js)      http://localhost:3000   ← abrir esta
#   prolog     (SWI-Prolog)   http://localhost:8081   IA del combate
#   ingest     (GameStats, Go)     http://localhost:8080   recibe los eventos
#   analytics  (GameStats, Scala)  http://localhost:9000   calcula las estadísticas
#
# ingest y analytics se construyen desde el código del Proyecto 1. Se usa la copia (fork)
# github.com/MelanyRodriguezR/GameStats, rama juegos-gameconsole, que agrega el analizador
# DINÁMICO (estadísticas generales + las que declara cada juego). El repositorio original
# (github.com/mauroza/GameStats) no se toca.
# Para usar otro GameStats: GAMESTATS_CONTEXT=<repo git#rama o carpeta local> docker compose up --build
# La primera vez tarda varios minutos (compila Go y Scala); después queda en caché.
# La carpeta ./juegos se monta en la consola: si copias ahí un juego nuevo con su
# manifest.json, aparece en la consola en unos segundos SIN reiniciar nada.

services:
  consola:
    build:
      context: .
      dockerfile: consola/Dockerfile
    ports: ["3000:3000"]
    environment:
      INGEST_URL: http://ingest:8080
      ANALYTICS_URL: http://analytics:9000
      PROLOG_URL: http://prolog:8081
    volumes:
      - ./juegos:/app/juegos:ro
    depends_on:
      prolog: { condition: service_started }
      ingest: { condition: service_healthy }
    restart: unless-stopped

  prolog:
    build: ./prolog
    ports: ["8081:8081"]
    restart: unless-stopped

  # GameStats se construye desde el código (las imágenes de GHCR del Proyecto 1 son privadas).
  ingest:
    build:
      context: ${GAMESTATS_CONTEXT:-https://github.com/MelanyRodriguezR/GameStats.git#juegos-gameconsole}
      dockerfile: ingest/Dockerfile
    ports: ["8080:8080"]
    environment:
      ANALYTICS_URL: http://analytics:9000/matches
      WORKERS: "4"
    volumes: [ingest-data:/data]
    depends_on:
      analytics: { condition: service_healthy }
    restart: unless-stopped

  analytics:
    build:
      context: ${GAMESTATS_CONTEXT:-https://github.com/MelanyRodriguezR/GameStats.git#juegos-gameconsole}
      dockerfile: analytics/Dockerfile
    ports: ["9000:9000"]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx512m -XX:+UseSerialGC
    volumes: [analytics-data:/data]
    restart: unless-stopped

volumes:
  ingest-data:
  analytics-data:
